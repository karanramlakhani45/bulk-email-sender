<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Email Sender - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Bulk Email Sender</h1>
    <p class="subtitle">Personalized rich HTML email campaign orchestrator</p>
    
    <button class="btn-login" onclick="login()">
      <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 8px; vertical-align: middle;">
        <path fill="#ffffff" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114-3.51 0-6.357-2.827-6.357-6.314s2.848-6.314 6.357-6.314c1.614 0 3.15.578 4.346 1.714l3.14-3.14C19.347 2.23 15.99 1 11.99 1 5.92 1 1 5.92 1 12s4.92 11 10.99 11c5.73 0 10.99-4.114 10.99-11 0-.772-.09-1.5-.26-1.714H12.24z"/>
      </svg>
      Login with Gmail
    </button>

    <div class="footer">
      <a href="privacy.html" target="_blank">Privacy Policy</a> &bull; <a href="terms.html" target="_blank">Terms & Conditions</a>
    </div>
  </div>

  <script>
    if (window.location.hostname === "127.0.0.1") {
      window.location.hostname = "localhost";
    }

    const API_BASE_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
      ? `${window.location.protocol}//${window.location.hostname}:5000`
      : (window.location.hostname.endsWith(".onrender.com")
          ? window.location.origin
          : "https://bulk-email-sender-uaig.onrender.com");

    function login(){
      const currentOrigin = window.location.origin;
      const currentPath = window.location.pathname;
      const pathDirectory = currentPath.substring(0, currentPath.lastIndexOf('/'));
      const redirectUri = `${currentOrigin}${pathDirectory}/dashboard.html`;
      window.location.href = `${API_BASE_URL}/auth/google?redirect_uri=${encodeURIComponent(redirectUri)}`;
    }
  </script>
</body>
</html>
